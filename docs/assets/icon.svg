<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="halo" cx="0.72" cy="0.24" r="0.55">
      <stop offset="0%" stop-color="#a9c6d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#a9c6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6dae6"/>
      <stop offset="100%" stop-color="#8fb3c2"/>
    </linearGradient>
    <radialGradient id="pupilGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d9a878" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d9a878" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 夜:圆角方形底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="196" fill="#0a0e15"/>
  <rect x="0" y="0" width="1024" height="1024" rx="196" fill="url(#halo)"/>

  <!-- 星点:偶尔,从不成群;不贴月牙,弧线保持绝对干净 -->
  <circle cx="712" cy="296" r="3.2" fill="#e9e4d6" opacity="0.85"/>
  <circle cx="788" cy="428" r="2" fill="#e9e4d6" opacity="0.5"/>
  <circle cx="296" cy="214" r="2.4" fill="#e9e4d6" opacity="0.6"/>
  <circle cx="272" cy="800" r="2" fill="#e9e4d6" opacity="0.4"/>

  <!-- 月牙:眼睛的弧线;怀抱朝右 -->
  <path d="M 460 212
           A 300 300 0 1 0 460 812
           A 340 340 0 0 1 460 212 Z"
        fill="url(#moon)"/>

  <!-- 瞳孔:唯一的暖色,在月牙怀抱的暗处 -->
  <circle cx="500" cy="512" r="118" fill="url(#pupilGlow)"/>
  <circle cx="500" cy="512" r="42" fill="#d9a878"/>
  <circle cx="488" cy="500" r="10" fill="#e9e4d6" opacity="0.85"/>
</svg>
